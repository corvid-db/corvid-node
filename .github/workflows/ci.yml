name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: golden suite — ${{ matrix.name }}
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64, runs-on: macos-latest }
          - { name: macos-x64, runs-on: macos-13 }
          - { name: linux-x64, runs-on: ubuntu-latest }
          - { name: linux-arm64, runs-on: ubuntu-24.04-arm }
          - { name: windows-x64, runs-on: windows-latest }
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Build native binding
        run: npx napi build --platform --release --js index-native.js --dts index-native.d.ts
      - name: Golden suite (256 fixture lines through the OOP surface)
        run: npx vitest run

  package:
    name: npm pack dry-run
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx napi build --platform --release --js index-native.js --dts index-native.d.ts
      - run: npm pack --dry-run
