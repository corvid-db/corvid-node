name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  surface-gate:
    # docs/SURFACE.tsv vs the engine's surface list at the PINNED tag:
    # every engine construct mapped (binding api + proving test) or N/A
    # with a reason; N/A count pinned to the committed baseline.
    name: surface gate (SURFACE.tsv vs pinned engine)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Resolve docs/SURFACE.tsv against the pinned engine surface
        run: ./scripts/surface-gate.sh

  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: golden suite — ${{ matrix.target }} / node${{ matrix.node }}
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        # Toolchain policy (scripts/bindings/README.md, engine repo):
        # modern minimums (engines >= 20; 18 is EOL), CI tests latest +
        # previous lines — 24 (current), 22 (LTS), 20 (floor) — across
        # every platform leg (same shape as corvid-python's matrix).
        # The include rows MUST carry `target` (a matrix key): a bare
        # include row without one merges into every combination instead
        # of multiplying — that collapsed an earlier revision of this
        # matrix to windows-only legs.
        node: [24, 22, 20]
        target: [macos-arm64, linux-x64, linux-arm64, windows-x64]
        include:
          # macos-x64 retired: GitHub retired macos-13 runners; no x86_64-darwin
          # runner exists (cross-check via cargo build --target when needed)
          - { target: macos-arm64, runs-on: macos-latest }
          - { target: linux-x64, runs-on: ubuntu-latest }
          - { target: linux-arm64, runs-on: ubuntu-24.04-arm }
          - { target: windows-x64, runs-on: windows-latest }
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      # npm install, not npm ci: the optionalDependencies platform stubs
      # are unpublished (first publish pending, docs/PLAN.md §5), so no
      # lockfile entries can exist for them — npm 11 (Node 24) rejects
      # that with `npm ci`. Restore `npm ci` when the platform packages
      # are on the registry.
      - run: npm install
      - name: Build native binding
        run: npx napi build --platform --release --js index-native.js --dts index-native.d.ts
      - name: Golden suite (267 fixture lines through the OOP surface)
        run: npx vitest run
      - name: Examples tour (six runnable programs, deterministic output)
        shell: bash # the for-loop is bash; the Windows default is pwsh
        run: |
          for ex in quickstart hybrid vector-index text-search graph geo; do
            echo "== examples/${ex}.js =="
            node "examples/${ex}.js"
          done

  package:
    name: npm pack dry-run
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # See the test job: npm install until the platform stubs are published.
      - run: npm install
      - run: npx napi build --platform --release --js index-native.js --dts index-native.d.ts
      - run: npm pack --dry-run
