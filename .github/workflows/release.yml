name: Release npm

# The napi-rs prebuilt publish flow (docs/PLAN.md §5): a tag push builds
# the platform matrix, then one publish job collects every artifact via
# `napi artifacts` and runs `napi pre-publish` — platform packages
# (corvid-node-<platform>) first, then the root corvid-node facade.
#
# Trigger: plain `v*` tags (the org-wide cascade — scripts/bindings/
# bump.sh --release-after-merge pushes vX.Y.Z here, matching every other
# binding repo) AND the historical `npm-publish-v*` shape. Either way the
# version part must equal package.json's version (guard in the publish
# job), and `napi pre-publish` keeps the platform-package versions and the
# root's optionalDependencies in sync with what it publishes.
#
# Publishes via npm trusted publishing (docs.npmjs.com/trusted-publishers):
# id-token: write lets the npm CLI (>= 11.5.1, bundled with the Node 24 the
# jobs install) pick up the GitHub OIDC token automatically — `napi
# pre-publish` shells out to plain `npm publish` per package, no
# NODE_AUTH_TOKEN/NPM_TOKEN secret. npm links trusted publishers PER PACKAGE
# (one each, no scope patterns): corvid-node and every corvid-node-<platform>
# package needs its own one-time linkage on npmjs.com (see
# scripts/bindings/README.md in the engine repo).
on:
  push:
    tags:
      - 'v*'
      - 'npm-publish-v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # darwin: both arches from the arm64 runner — x86_64-apple-darwin
          # cross-compiles with the Xcode toolchain (macos-13 runners are
          # retired; there is no x86_64 darwin runner left).
          - target: aarch64-apple-darwin
            runs-on: macos-latest
          - target: x86_64-apple-darwin
            runs-on: macos-latest
          # linux: gnu only for v1 (docs/PLAN.md §5); arm64 leg is native.
          - target: x86_64-unknown-linux-gnu
            runs-on: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runs-on: ubuntu-24.04-arm
          - target: x86_64-pc-windows-msvc
            runs-on: windows-latest
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # npm install, not npm ci: same reason as ci.yml — the platform
      # stubs are unpublished until this very workflow publishes them.
      - run: npm install
      - name: Build ${{ matrix.target }}
        run: npx napi build --release --target ${{ matrix.target }} --js index-native.js --dts index-native.d.ts
      # The crate's cdylib is named libcorvid_node (crate name) and napi
      # build does not rename cross-named cdylibs — copy it into place
      # explicitly, named by platformArchABI (napi's convention), NOT the
      # rust triple: index-native.darwin-arm64.node, not index-native.aarch64-apple-darwin.node.
      - name: Normalize the cdylib name for the artifacts pipeline
        shell: bash
        run: |
          set -euo pipefail
          t="${{ matrix.target }}"
          case "$t" in
            aarch64-apple-darwin)      abi="darwin-arm64" ;;
            x86_64-apple-darwin)       abi="darwin-x64" ;;
            aarch64-unknown-linux-gnu) abi="linux-arm64-gnu" ;;
            x86_64-unknown-linux-gnu)  abi="linux-x64-gnu" ;;
            x86_64-pc-windows-msvc)    abi="win32-x64-msvc" ;;
            *) echo "::error::unmapped target $t"; exit 1 ;;
          esac
          ext="so"; case "$t" in *-apple-darwin) ext="dylib";; *-windows*) ext="dll";; esac
          src="target/$t/release"
          if [ "$ext" = "dll" ]; then f="$src/corvid_node.dll"; else f="$src/libcorvid_node.$ext"; fi
          [ -f "$f" ] || { echo "::error::$f not found"; ls -la "$src" | head; exit 1; }
          cp "$f" "index-native.$abi.node"
      - name: Upload binding
        uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.target }}
          path: index-native.*.node
          if-no-files-found: error

  publish:
    name: publish platform packages, then the root package
    needs: build
    runs-on: ubuntu-latest
    # npm trusted publishing: the CLI detects the OIDC environment and
    # exchanges the token itself (also for the npm publish invocations napi
    # pre-publish shells out to). Job-level permissions REPLACE the
    # workflow-level set, so contents: read is restated for checkout +
    # the same-run artifact download below.
    permissions:
      id-token: write # OIDC for `npm publish`
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      - run: npm install
      # `napi artifacts` looks for a local ./artifacts directory; it does
      # not download anything itself. Pull the matrix's bindings-* archives
      # there (each containing index-native.<abi>.node) with the official action.
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          pattern: bindings-*
          merge-multiple: true
      - name: Collect the matrix artifacts into npm/
        run: npx napi artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # ---- publish: EXPLICIT npm publish per package ---------------------
      # Why not `napi pre-publish`: its dynamically-constructed, execSync'd
      # publish invocations stopped authenticating against npm's trusted
      # publishing (2026-09-02/03: every tag since v0.3.4 died with
      # E404-masked permission errors on the FIRST platform package, while
      # plain `npm publish` steps — corvid-js, same org, same day —
      # exchange the OIDC token fine). This is the same explicit shape
      # corvid-js uses: npm's own CLI performs the OIDC exchange, nothing
      # shells it out from under us. napi stays for what it is good at —
      # `napi artifacts` collecting the matrix builds into npm/ — and the
      # version sync pre-publish used to do (platform package.json
      # versions + the root's optionalDependencies) is the small node
      # script below, in-repo and reviewable.
      - name: Sync versions into the platform packages + optionalDependencies
        run: |
          node - <<'EOF'
          const fs = require('fs');
          const root = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const version = root.version;
          const optional = {};
          for (const entry of fs.readdirSync('npm', { withFileTypes: true })) {
            if (!entry.isDirectory()) continue;
            const pkgPath = `npm/${entry.name}/package.json`;
            if (!fs.existsSync(pkgPath)) continue;
            const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
            pkg.version = version;
            fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n');
            optional[pkg.name] = version;
          }
          root.optionalDependencies = {};
          for (const n of Object.keys(optional).sort()) root.optionalDependencies[n] = optional[n];
          fs.writeFileSync('package.json', JSON.stringify(root, null, 2) + '\n');
          console.log('synced', Object.keys(optional).join(', '), '->', version);
          EOF
      - name: Tag must match the package.json version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # no tag context on dispatch; the equality is enforced on tag pushes
            echo "dispatch: package.json version ${VERSION}"
          else
            TAG="${GITHUB_REF_NAME#v}"
            TAG="${TAG#npm-publish-}"   # historical prefix keeps working
            echo "tag: ${GITHUB_REF_NAME} (version part: ${TAG}), package.json version: ${VERSION}"
            if [ "$TAG" != "$VERSION" ]; then
              echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${VERSION}"
              exit 1
            fi
          fi
      - name: Publish the platform packages
        run: |
          set -euo pipefail
          for pkg in npm/*/; do
            [ -f "$pkg/package.json" ] || continue
            echo "::group::publish ${pkg}"
            (cd "$pkg" && npm publish --access public)
            echo "::endgroup::"
          done
      - name: Publish the root package (corvid-node)
        run: npm publish --access public
      # The partial-publish trap: a red run after a green publish (the
      # 0.3.3 cycle) or a mid-loop failure leaves the registry in a
      # half-versioned state. Verify EVERY package resolves at the tag's
      # version before the job goes green.
      - name: Verify every package is live at the tag's version
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          pkgs="corvid-node"
          for pkg in npm/*/; do
            [ -f "$pkg/package.json" ] || continue
            pkgs="$pkgs $(node -p "require('./${pkg}package.json').name")"
          done
          for p in $pkgs; do
            LIVE=$(npm view "$p@$VERSION" version)
            [ "$LIVE" = "$VERSION" ] || { echo "::error::$p@$VERSION is not live (npm view says '$LIVE')"; exit 1; }
            echo "$p@$VERSION live"
          done
